[project]
name = "abcbooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "h5py>=3.16.0",
    "iconoscope[all]>=0.2.1",
    "marimo>=0.25.2",
    "numpy>=2.5.4",
    "piffle>=0.9.0",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]


[tool.ruff.lint.per-file-ignores]
"classify.py" = [
    "B018",    # notebook display expressions
    "PLR1711", # marimo-generated cell returns
]

[tool.marimo.display]
cell_output = "below"  # display output below code instead of above (more like jupyter)
theme = "system"      # honor user preference, including in static html exports

[tool.marimo.save]
format_on_save = true

[tool.marimo.diagnostics]
enabled = true

[tool.marimo.experimental]
lsp = true
